<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/culinarian.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>今天吃什么？</title>
    <script>
      (function () {
        var mode = 'system'
        try {
          var stored = localStorage.getItem('ffxiv-theme')
          if (stored === 'light' || stored === 'dark' || stored === 'system') {
            mode = stored
          }
        } catch (e) {}
        var theme = 'light'
        if (mode === 'light') {
          theme = 'light'
        } else if (mode === 'dark') {
          theme = 'dark'
        } else {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
